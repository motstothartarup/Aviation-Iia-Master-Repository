<style>
  body { margin:0; padding:24px; font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:#f6f8fb; }
  .wrap { max-width:1100px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); padding:20px; }
  h1 { margin:0 0 12px 0; font-size:20px; }
  .row { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .muted { color:#6b7785; font-size:12px; }
  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:13px; }
  thead th { text-align:left; font-weight:600; padding:6px 8px; border-bottom:1px solid #ddd; background:#fafbfc; }
  tbody td { padding:6px 8px; border-bottom:1px solid #eee; vertical-align:top; }
  td.lvl { font-weight:700; width:100px; white-space:nowrap; }
  td.count { text-align:right; width:60px; color:#6b7785; }
  td.codes code { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; padding:2px 6px; border-radius:6px; margin:2px 4px 2px 0; display:inline-block; cursor:pointer; }
  code.comp { background:#fff3cd; color:#000; border:1px solid #f1c40f; }
  code.hl { background:#e74c3c; color:#fff; font-size:14px; font-weight:700; }
  code.user-hl { background:#fff3cd; color:#000; border:1px solid #f1c40f; box-shadow:0 0 0 1px rgba(0,0,0,.1) inset; }
  #downloadBtn { margin-top:10px; padding:6px 12px; border-radius:6px; border:none; background:#3498db; color:#fff; cursor:pointer; }
</style>

<div class="wrap">
  <div class="card" id="captureArea">
    <div class="row">
      <h1>ACA Airports by Region</h1>
      <div class="muted">Last updated: 2026-05-04 21:57 UTC</div>
    </div>
    <div class="row" style="margin-top:8px;">
      <label for="regionSelect" class="muted">Region:</label>
      <select id="regionSelect" aria-label="Choose region"></select>
    </div>

    <table id="acaTable">
      <thead>
        <tr>
          <th>ACA Level</th>
          <th>Airport Codes</th>
          <th style="text-align:right">Count</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <button id="downloadBtn">Download as JPEG</button>
</div>

},"Asia Pacific & Middle East":{"Level 5":["ADL","BLR","BOM","CHC","DEL","HYD","YPPF"],"Level 4+":["AMM","NPE","NTL","RAE","WLG","ZQN"],"Level 4":["AKL","BAH","BNE","CBR","DUD","DXB","HKG","HLZ","HND","ICN","ISA","ITM","KHH","KIX","LRE","NAN","NGO","NRT","OOL","PER","PMR","RUH","SYD","TPE","TSV","UKB"],"Level 3+":["BME","MCY","PPT","SHJ"],"Level 3":["AUH","BKK","CEI","CNX","DMK","DOH","DRW","DWC","HDY","KOS","KUL","MEL","MFM","SIN","SLL"],"Level 2":["DMM","EAM","EJH","GIZ","GOX","HKT","JED","MED","NOU","NPL","PHE","SHW","WAE"],"Level 1":["ABT","AHB","AJF","AQI","BHH","BKI","CEB","DQM","DWD","ELQ","HAS","HIJ","HOF","IVC","KCH","LGK","MCT","MEB","NSN","NUM","OERB","PEN","RAH","RAR","RSI","TIF","TUI","TUU","ULH","URY","YNB"]},"Europe":{"Level 5":["AMS","ARN","BYJ","EIN","FNC","GOT","HEL","IVL","KAO","KRN","KTT","LYS","MMX","NAP","NCE","OSD","PDL","RNB","RTM","RVN","TLN","VBY"],"Level 4+":["ABZ","ATH","BLQ","BMA","BRS","BRU","BUD","CEQ","CIA","CPH","CRL","DUB","EDI","ESB","FAB","FAO","FCO","FLW","GLA","GVA","HOR","LCA","LCY","LGW","LHR","LIN","LIS","LLA","LTT","LUX","LYN","MXP","OPO","ORY","PFO","PXO","SMA","SOU","TLS","UME","VCE"],"Level 4":["BCN","BER","BGY","BHX","BSL","BVA","CDG","CFN","IST","LBA","LBG","LGG","LTN","MAD","MRS","MUC","NCL","NTE","PMI","SNR","SOF","ZAG","ZRH"],"Level 3+":["AAL","ADB","AGH","AYT","DLM","EMA","HAM","KEF","MAN","MLA","OER","ORK","PMO","PRN","RIX","SDL","STN","TLL","TRN","TSF","VIE","VRN"],"Level 3":["AGP","ALC","ANR","BEG","BFS","BGO","BHD","BJV","BOD","BUS","CCF","CFE","CKZ","CLJ","CMF","CTA","DUS","EDO","EGC","ERZ","FLR","FRA","GNB","GYD","IBZ","KLR","KYA","LDE","LIL","MAH","MPL","MST","NCY","NOC","NOP","OLB","OSL","OST","OTP","PGF","PRG","PSA","PUF","RNS","SKP","SNN","STR","SVG","SXB","TBS","TIA","TRD","TRS","VAS","VNO"],"Level 2":["ACE","ACH","ADA","ADF","AHO","AJI","ANG","ASR","AUR","AVN","BAL","BBU","BES","BGG","BLL","BOH","BOJ","BQH","BVE","BYF","BZI","BZR","CAG","CDT","CFR","CGN","DBV","DIY","DNZ","DOL","ERC","EXT","EZS","FMM","GKD","GNY","GZP","GZT","HTY","IGD","ILD","ISE","KCM","KCO","KFS","KSY","KUN","LEU","LFDH","LIG","LJU","LYC","MLX","MQM","MSR","MZH","NAV","NKT","NQY","NWI","OGU","OHD","ORE","PIS","PLQ","RDZ","SXZ","SZF","TEQ","TJK","TLV","TZX","USQ","VAN","VAR","YEI","YKO"],"Level 1":["ALA","BIO","CFU","CHQ","DNR","DRS","EFL","ETM","EVN","FUE","GDN","GMZ","IOM","ISL","JMK","JSI","JTR","KGS","KRS","KVA","LEJ","LPA","MJT","PVK","RHO","RZV","SBZ","SCQ","SJJ","SKG","SMI","SPC","SVQ","TFN","TFS","TGD","TIV","VDE","VLC","WAW","XCR","ZAD","ZTH"]}}}</script>
<script id="competitor-data" type="application/json">{"PMI":["Passengers"],"ORY":["Passengers"],"DTW":["Passengers"],"DUB":["Passengers"],"CTU":["Passengers"],"LIS":["Passengers"],"FLL":["Passengers"],"ATH":["Passengers"],"VIE":["Passengers"],"WUH":["Passengers"],"MEL":["Passengers"],"CSX":["Passengers"],"NKG":["Passengers"],"ZRH":["Passengers"],"PHL":["Passengers"]}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('aca-data').textContent);
  const COMP = JSON.parse(document.getElementById('competitor-data').textContent || "{}");
  const sel = document.getElementById('regionSelect');
  const tbody = document.querySelector('#acaTable tbody');
  const levels = DATA.levels_desc || [];
  const regions = DATA.regions || [];
  const byRegion = DATA.by_region || {};
  const target = "LGA";
  const defaultRegion = "Americas";

  function option(v,t){
    const o=document.createElement('option');
    o.value=v; o.textContent=t; return o;
  }

  regions.forEach(r=>sel.appendChild(option(r,r)));
  if (regions.includes(defaultRegion)) sel.value = defaultRegion;

  function isActiveChip(el){
    // “Active” means currently highlighted on the table
    // either original competitor yellow or a user-added highlight
    return el.classList.contains('user-hl') || el.classList.contains('comp');
  }

  function toggleCode(codeEl){
    const code = (codeEl.textContent || "").trim().toUpperCase();
    if (!code) return;

    // Do not toggle the red target, just in case
    if (codeEl.classList.contains('hl')) return;

    const wasActive = isActiveChip(codeEl);
    const nowActive = !wasActive;

    if (nowActive){
      // Turning highlight ON
      codeEl.classList.remove('inactive');
      // If it is not already a competitor chip, use user-hl
      if (!codeEl.classList.contains('comp') && !codeEl.classList.contains('hl')){
        codeEl.classList.add('user-hl');
      }
    } else {
      // Turning highlight OFF
      codeEl.classList.remove('user-hl');
      codeEl.classList.remove('comp');
      codeEl.classList.add('inactive');
    }

    // Tell the parent (dashboard) so the map can add/remove the marker
    try {
      if (window.parent) {
        window.parent.postMessage(
          { type: "ACA_TOGGLE_CODE", code: code, active: nowActive },
          "*"
        );
      }
    } catch (e) {}
  }


  function render(region){
    tbody.innerHTML='';
    let total=0;
    const buckets = byRegion[region] || {};
    levels.forEach(lvl=>{
      const codes = (buckets[lvl] || []).slice().sort();
      total += codes.length;
      const tr = document.createElement('tr');
      const tdLvl=document.createElement('td'); tdLvl.className='lvl'; tdLvl.textContent=lvl;
      const tdCodes=document.createElement('td'); tdCodes.className='codes';
      const tdCount=document.createElement('td'); tdCount.className='count'; tdCount.textContent=String(codes.length);
      if(codes.length){
        codes.forEach(c=>{
          const chip = document.createElement('code');
          chip.textContent = c;

          if (c === target) {
            // Target stays red and is not clickable
            chip.classList.add('hl');
          } else {
            // Competitors start with yellow “comp”
            if (Array.isArray(COMP[c]) && COMP[c].length) {
              chip.classList.add('comp');
            }
            // All non-target codes can be toggled
            chip.addEventListener('click', function(){ toggleCode(chip); });
          }

          tdCodes.appendChild(chip);
        });
      } else {

        tdCodes.innerHTML='<span class="muted">—</span>';
      }
      tr.appendChild(tdLvl); tr.appendChild(tdCodes); tr.appendChild(tdCount);
      tbody.appendChild(tr);
    });
    const trTotal=document.createElement('tr');
    trTotal.innerHTML='<td class="lvl">Total</td><td></td><td class="count">'+total+'</td>';
    tbody.appendChild(trTotal);
  }

  sel.addEventListener('change', ()=>render(sel.value));
  render(sel.value || regions[0] || '');

  // Export as high-res JPEG
  document.getElementById('downloadBtn').addEventListener('click', () => {
    html2canvas(document.getElementById('captureArea'), { scale: 3 }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'aca_table.jpeg';
      link.href = canvas.toDataURL('image/jpeg', 1.0);
      link.click();
    });
  });
})();
</script>
